# 扫描间隔，最低 5 秒
interval_seconds=30

# ChatGPT/Codex 宿主退出后的宽限期
grace_minutes=5

# 宿主在线时，浏览器进程树无明显 CPU 活动的告警阈值
owned_browser_idle_minutes=20

# 宿主在线时，MCP/CodeGraph/AgentMemory/CUA runtime 无明显 CPU 活动的告警阈值
owned_tool_idle_minutes=30

# report 或 terminate；默认只报告
action=report

# 即使 action=terminate，也默认不结束宿主在线的闲置浏览器
terminate_owned_idle_browser=false

# 默认不自动结束宿主在线的闲置工具服务，只在 GUI/CLI 中提示
terminate_owned_idle_tool=false
