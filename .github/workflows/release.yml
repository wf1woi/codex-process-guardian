name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/guardian.exe, target/release/guardian-cli.exe, guardian.conf, README.md, Install-StartupTask.ps1, Remove-StartupTask.ps1 -Destination dist
          Compress-Archive -Path dist/* -DestinationPath codex-process-guardian-windows-x64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            codex-process-guardian-windows-x64.zip
            target/release/guardian.exe
            target/release/guardian-cli.exe

