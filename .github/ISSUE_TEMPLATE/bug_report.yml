name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v2.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows 环境
      description: Windows 版本、Codex/ChatGPT 版本及相关配置。

